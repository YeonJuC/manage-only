<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var base = "/manage-only/";
      var p = location.pathname.startsWith(base)
        ? location.pathname.slice(base.length)
        : location.pathname;
      location.replace(base + "#/" + p.replace(/^\/+/, "") + location.search + location.hash);
    </script>
  </head>
  <body></body>
</html>
